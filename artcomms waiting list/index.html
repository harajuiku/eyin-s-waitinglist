<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Art Commission - Cook Station</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
    }

    body {
      background-color: #fdf8f5;
      color: #333;
      overflow-x: hidden;
    }

    /* SISTEM PERPINDAHAN SCREEN */
    .screen {
      display: none;
      width: 100vw;
      min-height: 100vh;
      position: relative;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
       SCREEN 1: COOK STATION (WAITING LIST)
       ========================================== */
    #cook-station {
      background-image: url('r.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 0 0;
      min-height: 100vh;
    }

    /* 1. GANTUNGAN TIKET (ATAS) */
    .rack-container {
      width: 100%;
      border-top: 4px solid #333;
      border-bottom: 4px solid #333;
      padding: 15px 0;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(2px);
    }

    .tickets-scroll {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 10px 20px 15px 20px;
      scrollbar-width: thin;
    }

    /* TIKET ORDER GANTUNG */
    .ticket {
      flex: 0 0 180px;
      min-height: 210px;
      background: #fff;
      border: 3px solid #333;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      box-shadow: 3px 3px 0px #333;
      text-align: center;
      padding: 10px 8px;
    }

    .ticket::before, .ticket::after {
      content: '';
      position: absolute;
      top: -12px;
      width: 14px;
      height: 14px;
      border: 3px solid #333;
      background: #fff;
    }
    .ticket::before { left: 20px; }
    .ticket::after { right: 20px; }

    .ticket h4 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px dashed #ccc;
      width: 100%;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }

    .ticket .client-tag {
      font-weight: bold;
      font-size: 13px;
      color: #222;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .ticket .client-tag:hover {
      background: #fff3d1;
    }

    .ticket .desc-tag {
      font-size: 10px;
      color: #666;
      margin: 2px 0;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .ticket .desc-tag:hover {
      background: #fff3d1;
    }

    .status-badge {
      font-size: 10px;
      background: #fff3d1;
      border: 2px solid #333;
      padding: 4px 6px;
      border-radius: 10px;
      font-weight: bold;
      margin: 4px 0;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .status-badge:hover {
      background: #ffeaa7;
      transform: scale(1.02);
    }

    .btn-finish {
      background: #ff7675;
      color: #fff;
      border: 2px solid #333;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 1px 1px 0 #333;
      width: 100%;
      transition: all 0.1s;
    }

    .btn-finish:hover {
      background: #d63031;
    }

    /* 2. AREA TENGAH (KARAKTER & TOMBOL) */
    .middle-area {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin: 0 auto;
    }

    /* BALON PIKIRAN */
    .thought-bubble {
      position: absolute;
      top: 15px;
      right: 18%;
      background: #fff;
      border: 3px solid #333;
      border-radius: 50px;
      padding: 10px 18px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 2px 2px 0 #333;
      z-index: 5;
    }

    .thought-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 20px;
      width: 12px;
      height: 12px;
      background: #fff;
      border: 3px solid #333;
      border-radius: 50%;
    }

    /* FOTO ORANG MASAK (DITURUNKAN SEDIKIT BIAR KETUTUPAN MEJA BAWAH) */
    .chef-container {
      width: 380px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 3;
      margin-bottom: -35px; /* Menurunkan koki sampai menembus batas bawah */
    }

    .chef-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* TOMBOL KECIL "Ready to serve!" */
    .btn-serve {
      position: absolute;
      right: 5%;
      bottom: 45px;
      background: #fff;
      border: 3px solid #333;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #333;
      transition: all 0.2s;
      z-index: 5;
    }

    .btn-serve:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #333;
      background: #fff3d1;
    }

    /* 3. AREA MEJA & BAHAN-BAHAN MASAK (MEJA BAWAH MENUTUPI KOKI) */
    .kitchen-counter {
      width: 100%;
      min-height: 130px;
      border-top: 4px solid #333;
      padding: 10px 40px 30px 40px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-image: url('q.jpeg');
      background-size: cover;
      background-position: center;
      background-color: #fdf8f5;
      position: relative;
      z-index: 10; /* Z-INDEX TINGGI SUPAYA MEJA DI ATAS KOKI */
    }

    .ingredient-item {
      max-width: 95px;
      max-height: 95px;
      object-fit: contain;
      transform: translateY(-8px);
    }

    /* ==========================================
       SCREEN 2: READY TO SERVE (DONE GALERI)
       ========================================== */
    #ready-screen {
      padding: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .ready-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .ready-title {
      font-size: 36px;
      letter-spacing: 2px;
      text-align: center;
    }

    .btn-add-polaroid {
      background: #55efc4;
      border: 3px solid #333;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #333;
    }

    .btn-add-polaroid:hover {
      background: #00b894;
      color: #fff;
    }

    .polaroid-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      max-height: 65vh;
      overflow-y: auto;
      padding: 10px;
    }

    .polaroid-card {
      background: #fff;
      border: 3px solid #333;
      padding: 12px 12px 15px 12px;
      box-shadow: 4px 4px 0 #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .polaroid-delete {
      position: absolute;
      top: 4px;
      right: 6px;
      background: transparent;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #888;
    }
    .polaroid-delete:hover { color: #d63031; }

    .polaroid-img-box {
      width: 100%;
      height: 150px;
      border: 2px solid #333;
      margin-bottom: 10px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .polaroid-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .client-name {
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 6px;
      border: 1px dashed transparent;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .client-name:hover {
      background: #fff3d1;
      border-color: #333;
    }

    .btn-back {
      background: #fff;
      border: 3px solid #333;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #333;
      margin-top: 15px;
    }

    .btn-back:hover {
      background: #e1f5fe;
    }

    /* ==========================================
       POP-UP MODAL UMUM
       ========================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-card {
      background: #fff;
      border: 4px solid #333;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 6px 6px 0 #333;
    }

    .modal-card h3 {
      margin-bottom: 15px;
      text-align: center;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      border: 2px solid #333;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
    }

    .progress-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 5px;
    }

    .progress-btn-option {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0f0f0;
      border: 2px solid #333;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .progress-btn-option input {
      width: auto;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 8px;
      border: 2px solid #333;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 0 #333;
    }

    .btn-submit { background: #55efc4; }
    .btn-cancel { background: #ffeaa7; }

    /* TOMBOL FLOATING TAMBAH */
    .add-btn {
      position: fixed;
      bottom: 15px;
      left: 15px;
      background: #333;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      z-index: 100;
      box-shadow: 2px 2px 0 #888;
    }
  </style>
</head>
<body>

  <!-- TOMBOL TAMBAH ORDER -->
  <button class="add-btn" id="floatingAddBtn" onclick="openModal()">+ Tambah Comms Progress</button>

  <!-- ==========================================
       SCREEN 1: COOK STATION
       ========================================== -->
  <div id="cook-station" class="screen active">

    <!-- 1. GANTUNGAN TIKET ATAS -->
    <div class="rack-container">
      <div class="tickets-scroll" id="ticketList">
        
        <!-- Contoh Tiket 1 -->
        <div class="ticket" data-client="@username_a">
          <h4>comms progress</h4>
          <div class="client-tag" onclick="editTicketUser(this)" title="Klik untuk edit username">@username_a</div>
          <div class="desc-tag" onclick="editTicketDesc(this)" title="Klik untuk edit keterangan">Fullbody Chibi</div>
          <div class="status-badge" onclick="changeStatus(this)">[ Sketching ]</div>
          <button class="btn-finish" onclick="deleteTicket(this)">Tandai Sudah Selesai</button>
        </div>

        <!-- Contoh Tiket 2 -->
        <div class="ticket" data-client="@username_b">
          <h4>comms progress</h4>
          <div class="client-tag" onclick="editTicketUser(this)" title="Klik untuk edit username">@username_b</div>
          <div class="desc-tag" onclick="editTicketDesc(this)" title="Klik untuk edit keterangan">Icon Headshot</div>
          <div class="status-badge" onclick="changeStatus(this)">[ Coloring ]</div>
          <button class="btn-finish" onclick="deleteTicket(this)">Tandai Sudah Selesai</button>
        </div>

      </div>
    </div>

    <!-- 2. AREA TENGAH (KARAKTER & TOMBOL) -->
    <div class="middle-area">
      <div class="thought-bubble">
        Still cooking! 💭
      </div>

      <div class="chef-container">
        <img src="o.png" class="chef-img" alt="Orang Masak" onerror="this.onerror=null; this.src='https://via.placeholder.com/250?text=Foto+Orang+Masak';">
      </div>

      <button class="btn-serve" onclick="switchScreen('ready-screen')">
        Ready to serve! ➔
      </button>
    </div>

    <!-- 3. BAHAN & ALAT MASAK BAWAH (MEJA) -->
    <div class="kitchen-counter">
      <img src="n.png" class="ingredient-item" alt="Bahan 1" onerror="this.onerror=null; this.src='https://via.placeholder.com/70?text=Bahan+1';">
      <img src="b.png" class="ingredient-item" alt="Bahan 2" onerror="this.onerror=null; this.src='https://via.placeholder.com/70?text=Bahan+2';">
      <img src="e.png" class="ingredient-item" alt="Bahan 3" onerror="this.onerror=null; this.src='https://via.placeholder.com/70?text=Bahan+3';">
      <img src="i.png" class="ingredient-item" alt="Bahan 4" onerror="this.onerror=null; this.src='https://via.placeholder.com/70?text=Bahan+4';">
    </div>

  </div>

  <!-- ==========================================
       SCREEN 2: READY TO SERVE (SELESAI)
       ========================================== -->
  <div id="ready-screen" class="screen">

    <div class="ready-header">
      <h1 class="ready-title">READY TO SERVE!</h1>
      <button class="btn-add-polaroid" onclick="openPolaroidModal()">+ Tambah Polaroid Baru 🖼️</button>
    </div>

    <!-- GRID POLAROID HASIL COMMS -->
    <div class="polaroid-grid" id="readyGrid">
      
      <div class="polaroid-card">
        <button class="polaroid-delete" onclick="this.parentElement.remove()" title="Hapus Polaroid">✖</button>
        <div class="polaroid-img-box">
          <img src="hasil1.png" alt="Hasil Comms 1" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\'font-size:12px;color:#888;\'>result comms</span>';">
        </div>
        <div class="client-name" onclick="editClientName(this)" title="Klik untuk edit nama">@client_1 ✏️</div>
      </div>

    </div>

    <button class="btn-back" onclick="switchScreen('cook-station')">
      ➔ back to the cook station!
    </button>

  </div>

  <!-- ==========================================
       POP-UP MODAL 1: FORM TAMBAH COMMS TIKET
       ========================================== -->
  <div class="modal-overlay" id="modalForm">
    <div class="modal-card">
      <h3>🎨 Tambah Comms Progress</h3>
      
      <div class="form-group">
        <label>Nama / Username:</label>
        <input type="text" id="inputUser" placeholder="contoh: username_a">
      </div>

      <div class="form-group">
        <label>Keterangan:</label>
        <input type="text" id="inputDesc" placeholder="contoh: fullbody chibi color">
      </div>

      <div class="form-group">
        <label>Progress:</label>
        <div class="progress-options">
          <label class="progress-btn
